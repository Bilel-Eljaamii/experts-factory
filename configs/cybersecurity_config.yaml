# --- Model Settings ---
project_name: "cybersecurity-expert-v1"
base_model: "unsloth/gemma-2-9b-it-bnb-4bit"
max_seq_length: 2048
lora_rank: 32

# --- Training Hyperparameters ---
training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 5
  max_steps: 100 # Set to 300-500 for better results
  learning_rate: 0.0002 # This is 2e-4
  logging_steps: 1
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  seed: 3407
  output_dir: "models/adapters/cybersecurity"

# --- Hardware Settings ---
# On Colab T4, fp16 must be true and bf16 must be false.
fp16: true
bf16: false
