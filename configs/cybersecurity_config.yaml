# --- Model Loading Settings ---
project_name: "cybersecurity-expert-v0.0.1"
model:
  model_name: "unsloth/gemma-2-9b-it-bnb-4bit"
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true

# --- LoRA Adapter Settings ---
lora:
  r: 64 # Rank
  lora_alpha: 128 # Alpha
  lora_dropout: 0
  bias: "none"
  use_gradient_checkpointing: "unsloth"
  random_state: 3407
  target_modules: # Target all linear layers for maximum intelligence
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# --- Training Hyperparameters ---
training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  warmup_steps: 5
  max_steps: 500 # Set to 300-500 for better results
  learning_rate: 0.0002
  logging_steps: 1
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  seed: 3407
  output_dir: "models/adapters/cybersecurity"

# --- Hardware Settings ---
# On Colab T4, fp16 must be true and bf16 must be false.
fp16: true
bf16: false
